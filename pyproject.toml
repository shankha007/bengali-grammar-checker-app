[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bhashasetu"
version = "0.1.0"
description = "BhashaSetu - a language-pluggable grammar and writing assistant. Bengali is the first pack."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Phase 1 needs none of the neural stack. Kept separate so `make dev` stays fast
# and so the CPU-only path never accidentally imports torch.
hunspell = ["spylls>=0.1.7"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "redis>=5.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
bhashasetu = "bhashasetu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bhashasetu"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["spylls.*", "yaml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "SLF"]
# RUF001/002/003 flag "ambiguous unicode" - meaningless noise in a repo whose
# data files are deliberately full of non-Latin script.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, poke at private state to pin down internal rules, and build
# table names into SQL against an in-memory database.
"tests/*" = ["S101", "SLF001", "S603", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
