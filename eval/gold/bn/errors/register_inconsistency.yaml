# REGISTER_INCONSISTENCY — রীতির অসঙ্গতি
#
# Document-level drift between সাধু and চলিত. Distinct from GURUCHANDALI_DOSHA,
# which is a clash WITHIN one sentence.
#
# The distinction matters because a text that quotes an archaic letter, or a
# novel whose narration is চলিত and whose dialogue is সাধু, is not making an
# error. So the detector requires a minimum document length (4 labelled
# sentences) and a minority share above 15% before it will say anything, and it
# fires once per document rather than once per sentence.
#
# Cases here are multi-sentence by construction. `wrong` is omitted: the error
# is a property of the document, not of a span, so any REGISTER_INCONSISTENCY
# edit on the text counts as a hit.
#
# review: model — see eval/gold/README.md.

cases:
