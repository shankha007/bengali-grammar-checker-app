# POS_ERROR — পদ-ভ্রম
#
# The wrong part of speech in a slot: an abstract noun where an adverb belongs
# (দ্রুততা দৌড়াল for দ্রুত দৌড়াল), an adjective where a noun belongs, a verbal
# noun where a finite verb belongs.
#
# Bengali derivational morphology makes this a productive error: -তা makes an
# abstract noun, -ভাবে makes an adverb, and choosing the wrong one is easy and
# common.
#
# No detector until Phase 2. review: model — see eval/gold/README.md.

cases:
  # --- abstract noun where an adverb is needed
  - id: pe-001
    text: "সে দ্রুততা দৌড়াল মাঠের দিকে।"
    error_class: POS_ERROR
    wrong: "দ্রুততা"
    right: "দ্রুত"
    review: human
    reviewed_by: project-owner
    source: model-authored
  - id: pe-002
