# VERB_INFLECTION — ক্রিয়ার রূপভ্রম
#
# Bengali verbs agree with the subject's PERSON and HONORIFIC level. Three
# second-person grades — তুই (intimate/inferior), তুমি (familiar), আপনি
# (respectful) — each take a distinct ending, and third person splits সে / তিনি
# the same way. Getting this wrong is not a stylistic slip; it changes who the
# sentence is addressing and how.
#
# No detector until Phase 2 (Stage 2 token classification). Recall is 0.0 today
# and the eval reports it as such rather than omitting the row.
#
# review: model — see eval/gold/README.md.

