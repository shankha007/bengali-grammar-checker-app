  # --- সাধু honorific (-েন) in a চলিত sentence.
  #
  # Everything above this line is a শাধু form the detector already knew. These
  # were added after testing the checker on prose it had never seen: the whole
  # honorific column was being labelled চলিত, because গিয়াছেন ends in "ছেন".
  # Thirty-five gold cases scored 1.000 recall while the detector was blind to
  # an entire paradigm — the gap was in the sample, not in the metric.
  - id: gd-036
    text: "তিনি বাড়ি গিয়াছেন এবং এখন খাচ্ছেন।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "গিয়াছেন"
    right: "গেছেন"
    review: model
    source: model-authored
  - id: gd-037
    text: "তিনি আসিয়াছেন, আমরা তাঁকে দেখছি।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "আসিয়াছেন"
    right: "এসেছেন"
    review: model
    source: model-authored
  - id: gd-038
    text: "শিক্ষক বলিয়াছেন যে পরীক্ষা কাল হচ্ছে।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "বলিয়াছেন"
    right: "বলেছেন"
    review: model
    source: model-authored
  - id: gd-039
    text: "তিনি খাইতেছিলেন যখন আমি ঘরে ঢুকলাম।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "খাইতেছিলেন"
    right: "খাচ্ছিলেন"
    review: model
    source: model-authored
  - id: gd-040
    text: "মা রান্না করিতেছিলেন আর আমরা অপেক্ষা করছিলাম।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "করিতেছিলেন"
    right: "করছিলেন"
    review: model
    source: model-authored

  # --- চলিত future beside a সাধু verb.
  #
  # These sentences carried a সাধু marker and nothing to clash with, because
  # যাবে / করবেন / আসবে were not markers at all. Future tense is where a writer
  # drifting between registers is most likely to be caught, which made this the
  # widest hole in the detector.
  - id: gd-041
    text: "লোকটি কহিল সে কাল যাবে।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "কহিল"
    right: "বলল"
    review: model
    source: model-authored
  - id: gd-042
    text: "তিনি বলিলেন যে তিনি কাল আসবেন।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "বলিলেন"
    right: "বললেন"
    review: model
    source: model-authored
  - id: gd-043
    text: "যাহা বলিবার সে বলবে।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "যাহা"
    right: "যা"
    review: model
    source: model-authored
  - id: gd-044
    text: "সে করিয়া দেবে বলেছে।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "করিয়া"
    right: "করে"
    review: model
    source: model-authored
  # The minority register is what gets flagged, so in a সাধু sentence it is the
  # চলিত verb that is the error — the reverse of every case above it.
  - id: gd-045
    text: "তিনি ইহা দেখিবেন এবং পরে জানাবেন।"
    error_class: GURUCHANDALI_DOSHA
    wrong: "জানাবেন"
