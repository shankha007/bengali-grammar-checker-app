# GURUCHANDALI_DOSHA — গুরুচণ্ডালী দোষ
#
# সাধু and চলিত forms mixed inside ONE sentence. The flagship feature.
#
# Contrast with clean.yaml, which holds sentences written consistently in each
# register — those are correct prose and flagging them is the failure mode this
# class must avoid. A সাধু sentence is not an error; a সাধু word in a চলিত
# sentence is.
#
# Across sentences rather than within one, this is REGISTER_INCONSISTENCY —
# a different class with a different threshold.
#
# review: model — see eval/gold/README.md.

