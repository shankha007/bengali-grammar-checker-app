# PUNCTUATION — যতিচিহ্নের ভুল
#
# The dari (।) is the Bengali sentence terminator; a Latin period is not. Space
# goes after a terminator, never before. Note the near-miss cases held in
# clean.yaml: a period inside "Ph.D.", a URL, or a decimal number is correct and
# must never be flagged.
#
# review: model — see eval/gold/README.md.

cases:
