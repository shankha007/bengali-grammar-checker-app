# HOMONYM — সমোচ্চারিত ভিন্নার্থক শব্দ
#
# The erroneous token is a REAL, correctly-spelt word — just the wrong one for
# this context. That is what makes the class hard: no dictionary lookup can see
# it, and the spec's cited research puts LLM accuracy here below 20%.
#
# Consequence for Phase 1: recall on this slice is expected to be near zero.
# Stage 1 has three collocation rules and nothing else. These cases are here as
# training and evaluation material for the Stage 2 BanglaBERT head, and as the
# measure of how much that head buys.
#
# Every `wrong` form below MUST be a real word. If it is not, the case belongs
# in non_word.yaml — validate_gold.py checks this.
#
# review: model — see eval/gold/README.md.

cases:
