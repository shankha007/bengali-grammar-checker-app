# AGREEMENT — অন্বয়-ভ্রম
#
# Number and animacy agreement between subject and verb. Bengali has no gender
# agreement on verbs, so this class is narrower than its equivalent in most
# European languages — the live distinctions are:
#
#   * animate vs inanimate subject selects আছে / আছেন and the honorific series
#   * an inanimate plural does NOT take the honorific ending, however large
#   * -রা marks animate plurals only; inanimate plurals take -গুলো
#
# Overlaps VERB_INFLECTION at the edges. The rule used here: if the error is the
# subject's person/honorific grade, it is VERB_INFLECTION; if it is number or
# animacy, it is AGREEMENT.
#
# No detector until Phase 2. review: model — see eval/gold/README.md.

cases:
