# NOTVA_SHOTVA — ণত্ব ও ষত্ব বিধান
#
# Both বিধান apply to তৎসম words ONLY. A case belongs here when the erroneous
# form is a ণ/ষ rule violation in a word of Sanskrit origin. If the word is
# তদ্ভব, দেশি or বিদেশি, ন and স are correct and there is no error — those
# belong in clean.yaml, and several are there deliberately (ঠান্ডা, ভাসা).
#
# review: model — see eval/gold/README.md.

cases:
