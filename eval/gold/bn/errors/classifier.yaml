# CLASSIFIER — পদাশ্রিত নির্দেশক
#
# Bengali numerals take a classifier that agrees with ANIMACY and, loosely, with
# register:
#
#   জন    — human            (তিনজন ছাত্র)
#   টা/টি — inanimate, count (তিনটি বই); টি is the more formal of the two
#   খানা/খানি — flat or sheet-like things (একখানা কাগজ, একখানি চিঠি)
#   গুলো/গুলি — plural definite; গুলি is the more formal
#   টুকু  — mass / partitive (একটুকু জল)
#
# The commonest real error is জন with an inanimate noun or টি with a person.
#
# No detector until Phase 2. review: model — see eval/gold/README.md.

cases:
  # --- জন used with an inanimate noun
  - id: cl-001
    text: "তিনজন বই টেবিলের উপর রাখা আছে।"
    error_class: CLASSIFIER
    wrong: "তিনজন"
    right: "তিনটি"
    review: human
    reviewed_by: project-owner
    source: model-authored
  - id: cl-002
    text: "আমি দুজন কলম কিনেছি।"
    error_class: CLASSIFIER
    wrong: "দুজন"
    right: "দুটি"
    review: human
    reviewed_by: project-owner
    source: model-authored
  - id: cl-003
    text: "বাগানে পাঁচজন গাছ লাগানো হয়েছে।"
    error_class: CLASSIFIER
