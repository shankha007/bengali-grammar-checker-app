# CASE_MARKER — বিভক্তি-ভ্রম
#
# Bengali marks কারক with বিভক্তি suffixes:
#
#   -কে   objective / dative, and animate direct objects
#   -র/-এর genitive
#   -তে/-এ locative (place, time, instrument)
#   -য়    locative after a vowel-final stem
#   ০     nominative, and inanimate direct objects
#
# The commonest real error is -কে where a locative is needed (স্কুলকে যায় for
# স্কুলে যায়), and the reverse on animate objects.
#
# No detector until Phase 2. review: model — see eval/gold/README.md.

