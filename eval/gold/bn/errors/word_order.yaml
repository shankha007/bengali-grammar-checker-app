# WORD_ORDER — পদক্রম-ভ্রম
#
# Bengali is SOV and comparatively free, which is exactly what makes this class
# treacherous: most reorderings are grammatical, merely marked or emphatic. Only
# genuinely ungrammatical orders belong here.
#
# The reliable constraints — the ones these cases are built on:
#
#   * the negator না follows the finite verb (আমি যাব না, never না আমি যাব)
#   * a genitive precedes its head noun (আমার বই, never বই আমার as a statement)
#   * an adjective precedes its noun (ভালো ছেলে, never ছেলে ভালো attributively)
#   * a classifier-number phrase precedes its noun (তিনটি বই)
#   * postpositions follow their complement (টেবিলের উপরে)
#
# `right` here is a full corrected sentence rather than a single token, because
# a reordering has no single replacement span. The span in `wrong` marks where
# the problem is first visible.
#
# No detector until Phase 2. review: model — see eval/gold/README.md.

cases:
  # --- negator placement
  - id: wo-001
    text: "না আমি কখনো ভাত খাই।"
    error_class: WORD_ORDER
    wrong: "না আমি"
    right: "আমি কখনো ভাত খাই না।"
    review: human
    reviewed_by: project-owner
    source: model-authored
