# BhashaSetu Bengali gold set — CLEAN slice.
#
# Every sentence here is believed to be correct Bengali. Any edit the pipeline
# surfaces on any of them is a FALSE POSITIVE, and the resulting rate is, per
# spec §8, the single most important number in the project. Ceiling: 3%.
#
# ---------------------------------------------------------------------------
# Reviewed and accepted by the project owner, 2026-08-02.
# ---------------------------------------------------------------------------
# One caveat survives review and is worth keeping in view: these sentences were
# model-authored, so the checker is partly being measured against text shaped by
# the same process. Human sign-off removes the question of whether the Bengali is
# correct; it does not make the sample independent. Augmenting this file from
# real published Bengali — spec §2 names Bangla Wikipedia and Prothom Alo dumps —
# would still strengthen the claim, and is the cheapest remaining win on the
# metric that matters most.
#
# The near-miss cases below are the point of the file. They are the sentences a
# careless rule set gets wrong, so they belong in the clean slice, not out of it:
#
#   * সাধু prose that is internally consistent (correct, not গুরুচণ্ডালী)
#   * দেশি words with ন before ট-বর্গ (ঠান্ডা) — the ণত্ব rule does not reach them
#   * real words that are also plausible misspellings (ভাসা, পুরান, কুল, দিন)
#   * periods inside abbreviations, URLs and decimals — not sentence terminators
#   * চলিত forms that look সাধু by suffix (দিলাম, নিলাম) — see the stem-length
#     guard in data/register.yaml

