# Bengali affix inventory used for lexicon lookup, NOT for correctness judgement.
#
# Purpose is recall: বইগুলোকেও must resolve to বই so it is never flagged as a
# non-word. Whether a given suffix is *appropriate* here is a CASE_MARKER /
# CLASSIFIER question answered at Stage 2 (Phase 2), not a spelling question.
#
# Consequence, stated plainly: over-generous stripping lowers false positives and
# raises false negatives. Given spec §8 weights F0.5 (precision-heavy) and calls
# the clean-text false-positive rate the most important number in the project,
# that trade is the correct direction. `make eval` reports both sides so the
# choice stays visible rather than assumed.

# Productive prefixes. Bengali compounds these freely with a following noun and
# bn_BD lists only a fraction of the results: এদেশ, এবার, সবসময়, প্রতিদিন are
# ordinary words that a stem-based dictionary misses. Stripping a prefix and
# re-checking the remainder recovers them without listing every compound.
#
# Closed list on purpose. A general "try splitting anywhere" rule would accept
# almost any string and destroy NON_WORD recall.
prefixes:
  - "এ"
  - "ও"
  - "সে"
  - "সব"
  - "প্রতি"
  - "উপ"
  - "অ"
  - "অন"
  - "নি"
  - "সু"
  - "দুর"
  - "পুনঃ"
  - "আধা"

# Suffixes that only attach to a VOWEL-final stem.
#
# This is not a "generous vs strict" dial like the rest of the file — it is the
# difference between a reading Bengali allows and one it does not. The genitive
# after a consonant is -এর / -ের: ঘর → ঘরের, never ঘরর. Bare -র is genitive only
# after a vowel: মা → মার, বাবা → বাবার, নদী → নদীর.
#
# Without the constraint the stripper would peel -র off anything, so a
# misspelling that happens to end in র resolved to a real stem and was accepted
# in silence. কাপর (should be কাপড়) parsed as কাপ + genitive and the checker
# reported the sentence clean; শিকর (শিকড়) did the same. That is the worst
# failure mode this file has, because over-generous stripping is supposed to
# cost recall on words the dictionary lacks — not to whitewash a real error on a
# word it has.
#
# Measured before adding: across the seed lexicon, extra_words and the whole
# gold clean slice, ZERO real words are lost to this. Every string it newly
# rejects (ঘরর, হাতর, স্কুলর) is one Bengali cannot build.
#
# Orthographic test, not phonological: a stem is vowel-final when it ends in a
# vowel sign or an independent vowel. Bengali's inherent vowel makes the true
# rule subtler — ছাত্র is pronounced with a final vowel — but the genitive there
# is ছাত্রের anyway, so the orthographic test lands on the right answer.
vowel_final_only:
  - "র"
  - "রে"
  - "য়"
  - "য়ে"

suffixes:
  # বিভক্তি - case markers
  case:
    - "কে"
    - "রে"
    - "র"
    - "এর"
    - "য়ের"
    - "ের"
    - "তে"
    - "েতে"
    - "য়"
    - "য়ে"
    - "ে"

  # plural / collective
  plural:
    - "রা"
    - "েরা"
    - "গুলো"
    - "গুলি"
    - "গুলা"
    - "দের"
    - "দিগের"
    - "দিগকে"
    - "গণ"
    - "বৃন্দ"
    - "সমূহ"

  # classifiers - number/animacy agreement lives at Stage 2
  classifier:
    - "টা"
    - "টি"
    - "টে"
    - "খানা"
    - "খানি"
    - "টুকু"
    - "টুক"

  # enclitics - outermost layer, stripped first by longest-match
  enclitic:
    - "ও"
    - "ই"
    - "তো"

  # verb inflection - person/tense/honorific. Deliberately partial: this list
  # exists to stop false NON_WORD flags on common finite forms, not to model
  # Bengali conjugation. The real morphology lands with the analyser in Phase 4.
  verb:
    - "ছিলাম"
    - "ছিলেন"
    - "ছিলে"
    - "ছিল"
    - "ছেন"
    - "ছিস"
    - "ছি"
    - "ছে"
    - "তাম"
    - "তেন"
    - "তিস"
    - "লাম"
    - "লেন"
    - "লে"
    - "লো"
    - "ল"
    - "বেন"
    - "বে"
    - "বি"
    - "ব"
    - "ইয়া"
    - "িয়া"
    - "য়া"
    - "ইতে"
    - "িতে"
    - "েছে"
    - "েছি"
    - "েছেন"
